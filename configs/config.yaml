# Configuración del proyecto (actividad 2).
# Todo lo que puede cambiar (datos, modelo, MLflow) vive aquí, no en el código.

datos:
  ruta: data/pipelyne_DatasetFuga.csv   # relativa a actividades/actividad-2/
  path: data
  ruta_train: data/train_fuga.csv
  ruta_test: data/test_fuga.csv

division:
  test_size: 0.2
  random_state: 42          # también se registra como semilla en MLflow

# Conjuntos de features. Cada candidato se entrena con cada uno: un run por combinación.
# adaptados al dataset de Fuga de Empleados
features:
  - nombre: all
    columnas: ALL
  - nombre: custom
    columnas:
      - Edad
      - Salario_Mes
      - Tenure_Meses
      - Meses_En_Cargo
      - Meses_Con_Jefe
      - Ausentismo_Trimestre

# Configuración del Grid Search ligero aplicado a cada candidato con `param_grid`.
grid_search:
  activo: true
  cv: 3
  scoring: roc_auc
  n_jobs: -1

# Modelos que el flow de entrenamiento compara. Cada uno se entrena con cada conjunto de `features`.
# Cada run se llama `<nombre_run>-<nombre de features>`. Solo el de mayor AUC se evalúa para champion.
candidatos:
  - nombre_run: churn-logreg
    tipo: logistic_regression
    parametros:
      max_iter: 1000
      random_state: 42
    param_grid:
      C: [0.1, 1.0, 10.0, 100.0]
  - nombre_run: churn-gbt
    tipo: gradient_boosting
    parametros:
      max_depth: 3
      random_state: 42
    param_grid:
      n_estimators: [100, 200, 300, 400]
      learning_rate: [0.05, 0.1, 0.2, 0.5, 2]
  - nombre_run: churn-rf
    tipo: random_forest
    parametros:
      random_state: 42
    param_grid:
      n_estimators: [100, 250, 500]
      max_depth: [8, 15]
  - nombre_run: churn-et
    tipo: extra_trees
    parametros:
      random_state: 42
    param_grid:
      n_estimators: [100, 150, 200]
      max_depth: [8, 15, 50]
  - nombre_run: churn-hgb
    tipo: hist_gradient_boosting
    parametros:
      max_iter: 100
      random_state: 42
    param_grid:
      learning_rate: [0.05, 0.1]
      max_depth: [3, 6]
  - nombre_run: churn-lgbm
    tipo: lightgbm
    parametros:
      random_state: 42
      verbose: -1
      n_jobs: 1
    param_grid:
      n_estimators: [100, 150]
      learning_rate: [0.05, 0.1]

mlflow:
  tracking_uri: http://localhost:5000  # servidor de MLflow de services/. Sin servidor: sqlite:///mlflow.db. MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: churn-training-mlops-v2    # nombre del experimento donde se agrupan los runs
  nombre_run: churn-training-v2           # nombre de cada run dentro del experimento

metricas:
  umbral: 0.5                          # probabilidad a partir de la cual se predice churn (Exited = 1)

# Actividad 2: registro del modelo e inferencia.
registro:
  nombre_modelo: fuga-modelo-v2   # nombre en el Model Registry de MLflow
  umbral_auc: 0.6                 # AUC mínimo para ser champion; además debe superar al champion actual
                                  # Si no hay champion, cualquier modelo con AUC > umbral_auc se promueve a champion para iniciar la inferencia.

inferencia:
  tamano_lote: 100              # clientes que se puntúan en cada ejecución diaria
  carpeta_salida: data          # relativa a la raíz
  nivel_drift: 0.6              # emulación de drift: fracción de variables numéricas desplazadas en el lote (0.0 = sin drift)

# Monitoreo de drift (actividad 3).
monitoreo:
  lote_actual: lotes/lote_actual.csv  # lote que puntúa la inferencia; lo leen los flows de drift
  umbral_drift: 0.3                   # fracción de variables con drift a partir de la cual se emite una alerta
  alfa_evento: 0.05                   # p-valor por debajo del cual el drift del target se considera drift
  carpeta_reportes: reports           # relativa a la raíz
